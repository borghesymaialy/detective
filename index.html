/* ============ GENERATORE DEGLI INDIZI ============ */
function generate(pins, variant, seed) {
  let x = seed * 7919 + 13;
  const rnd = () => { x = (x * 9301 + 49297) % 233280; return x / 233280; };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const A = byId(SUS, pins.assassino), V = byId(SUS, pins.vittima), W = byId(WEA, pins.arma), M = byId(MOT, pins.movente);
  const clues = [], count = {}; let id = 0;

  const add = (room, text, tag, kind, extra) => { clues.push(Object.assign({ id: 'c' + (id++), room, text, tag, kind, removed: false }, extra || {})); count[room]++; };
  const place = exclude => {
    let opts = ROOMS.map(r => r.id).filter(r => !exclude.includes(r) && count[r] < 4);
    if (!opts.length) opts = ROOMS.map(r => r.id).filter(r => !exclude.includes(r));
    return shuffle(opts)[0];
  };
  const traits = shuffle(traitClues(A, false));
  add(pins.stanza, 'Segni di lotta: sedia rovesciata, faldoni a terra', 'Scena', 'scena');
  add(pins.stanza, W.clue, 'Strumento · residuo', 'arma');
  add(pins.stanza, traits[0].t, 'Responsabile · ' + traits[0].a, 'killer', { attr: traits[0].a });
  add(pins.stanza, traits[1].t, 'Responsabile · ' + traits[1].a, 'killer', { attr: traits[1].a });
  const r1 = place([pins.stanza]);

  add(place([pins.stanza, r1]), traits[3].t, 'Responsabile · ' + traits[3].a, 'killer', { attr: traits[3].a });
  add(W.origin, W.missing, 'Strumento · provenienza', 'origine');
  const docs = M.v[variant].d(A.name, V.name);
  const d1 = place([pins.stanza]);
  add(d1, docs[0], 'Causale · ' + first(A.name), 'movente');
  add(place([pins.stanza, d1]), docs[1], 'Causale · ' + first(A.name), 'movente');

function goTab(t) { if (t === V.tab) return; if (t === 'rate') V.prev = V.tab; V.tab = t; V.sel = 'A1'; draw(); }

function draw() {
  const boss = V.tab === 'rate';
  const sheet = boss ? rateSheet() : V.build(V.tab);
  const file = boss ? 'Simulazione_mutuo_Colombo.xlsx' : V.file;
  document.getElementById('fname').textContent = file;
  document.title = file;
  const colW = sheet.colW, rows = sheet.rows.slice();
  while (rows.length < (sheet.minRows || 36)) rows.push(null);
  let h = '<div class="hdr"><div class="corner"></div>' + colW.map((w, i) => `<div style="width:${w}px">${LET[i]}</div>`).join('') + `<div class="fill">${LET[colW.length]}</div></div>`;
  rows.forEach((row, ri) => {
    const n = ri + 1; let col = 0, cells = '';
    (row || []).forEach(c => {
      const span = c.span || 1; let w = 0;
      for (let k = 0; k < span; k++) w += colW[col + k] || 0;
      const ref = LET[col] + n; col += span;
      const cls = ['c', c.h && 'h', c.b && 'b', c.wrap && 'wrap', c.align === 'right' && 'ra', c.align === 'center' && 'ca',
        c.a && 'act', c.muted && 'muted', c.x && 'x', c.strike && 'strike', c.warn && 'warn', c.ok && 'ok', c.err && 'err', V.sel === ref && 'sel'].filter(Boolean).join(' ');
      const f = c.f != null ? c.f : (c.t == null ? '' : String(c.t));
      const act = c.a ? ` data-a="${c.a}" data-id="${esc(c.id == null ? '' : c.id)}" role="button" tabindex="0"` : '';
      cells += `<div class="${cls}" style="width:${w}px" data-ref="${ref}" data-f="${esc(f)}"${act}>${c.html != null ? c.html : esc(c.t == null ? '' : c.t)}</div>`;
    });
    while (col < colW.length) { const ref = LET[col] + n; cells += `<div class="c${V.sel === ref ? ' sel' : ''}" style="width:${colW[col]}px" data-ref="${ref}" data-f=""></div>`; col++; }
    h += `<div class="row"><div class="rn">${n}</div>${cells}<div class="c fill" data-ref="${LET[colW.length] + n}" data-f=""></div></div>`;
  });
  const grid = document.getElementById('grid'), top = grid.scrollTop;
  grid.innerHTML = h;
  if (!V.keepScroll) grid.scrollTop = 0; else grid.scrollTop = top;
  V.keepScroll = false;
  document.getElementById('tabs').innerHTML = V.tabs.map(([id, name]) => `<button role="tab" aria-selected="${V.tab === id}" class="${V.tab === id ? 'on' : ''}" data-tab="${id}">${name}</button>`).join('');
  const selEl = grid.querySelector(`[data-ref="${V.sel}"]`);
  document.getElementById('fref').textContent = V.sel;
  document.getElementById('ftext').textContent = selEl ? selEl.dataset.f : '';
  drawStatus();
}

function selectHtml(key, options, value, placeholder) {
  return `<select data-k="${key}" aria-label="${esc(placeholder || key)}"><option value="">${esc(placeholder || 'Seleziona…')}</option>` +
    options.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(value) ? ' selected' : ''}>${esc(l)}</option>`).join('') + '</select>';
}
function inputHtml(key, value, ph, max) { return `<input data-k="${key}" value="${esc(value || '')}" placeholder="${esc(ph || '')}" maxlength="${max || 40}" autocomplete="off" aria-label="${esc(ph || key)}">`; }

function rateSheet() {
  const Cap = 180000, r = 0.032 / 12, N = 300, R = Cap * r / (1 - Math.pow(1 + r, -N));
  const eur = v => v.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const rows = [
    [C('PROSPETTO RATE MUTUO · simulazione cliente', { b: true, span: 6 })],
    [C('Capitale'), C(eur(Cap), { align: 'right' }), C('Tasso annuo'), C('3,20%', { align: 'right' }), C('Durata'), C('25 anni', { align: 'right' })],
    null,
    H(['N. rata', 'Scadenza', C('Rata', { align: 'right' }), C('Quota interessi', { align: 'right' }), C('Quota capitale', { align: 'right' }), C('Debito residuo', { align: 'right' })])
  ];
  let debt = Cap;
  for (let i = 1; i <= 28; i++) {
    const it = debt * r, cp = R - it; debt -= cp;
    const m = (9 + i) % 12, y = 2026 + Math.floor((9 + i) / 12);
    rows.push([C(String(i), { align: 'right' }), C('01/' + String(m + 1).padStart(2, '0') + '/' + y), C(eur(R), { align: 'right', f: '=RATA(3,2%/12;300;-180000)' }),
      C(eur(it), { align: 'right' }), C(eur(cp), { align: 'right' }), C(eur(debt), { align: 'right' })]);
  }
  return { colW: [90, 120, 130, 150, 150, 160], rows };
}

/* ============ REGISTRO (HOME) ============ */
async function Home() {
  let code = '', list = null, err = false;
  const STATO = { aperto: 'In istruttoria', risolto: 'Chiusa · esito corretto', fallito: 'Chiusa · esito errato' };
  function build() {
    const rows = [
      [C('REGISTRO PRATICHE', { b: true, span: 5 })],
      null,
      [C('Nuova pratica', { h: true }), C('▸ Predisponi nuova pratica', { a: 'new', span: 2 })],
      [C('Apri pratica', { h: true }), C('', { html: inputHtml('code', code, 'Codice a 6 caratteri', 6) }), C('▸ Apri', { a: 'open' })],
      null,
      [C('PRATICHE PREDISPOSTE', { b: true, span: 5 })],
      H(['Codice', 'Stato', C('Punteggio', { align: 'right' }), 'Data', 'Operazione'])
    ];
    const codes = myCases();
    if (!codes.length) rows.push([C('Nessuna pratica predisposta da questo computer', { muted: true, span: 5 })]);
    else if (err) rows.push([C('Registro non disponibile: verificare la connessione al database', { err: true, span: 5 })]);
    else if (!list) rows.push([C('Caricamento…', { muted: true, span: 5 })]);
    else codes.forEach(c => {
      const r = list.find(d => d.codice === c); if (!r) return;
      rows.push([C(c), C(STATO[r.stato], { ok: r.stato === 'risolto', err: r.stato === 'fallito' }),
        C(r.accusa ? String(r.accusa.punti) : '', { align: 'right' }), C(new Date(r.creato_il).toLocaleDateString('it-IT')), C('▸ Apri', { a: 'go', id: c })]);
    });
    return { colW: [150, 230, 110, 120, 280], rows };
  }
  const openCode = () => { const v = code.trim().toUpperCase(); if (v.length === 6) go('caso=' + encodeURIComponent(v)); else note('Il codice pratica è di 6 caratteri.', true); };
  openView({
    file: 'Registro_pratiche.xlsx', tabs: [['reg', 'Registro'], ['rate', 'Prospetto_rate']], tab: 'reg', build,
    status: () => 'Pratiche: ' + myCases().length,
    onAction: (a, id) => { if (a === 'new') go('crea'); else if (a === 'open') openCode(); else if (a === 'go') go('caso=' + id); },
    onInput: (k, v) => { if (k === 'code') code = v; }
  });
  document.getElementById('grid').addEventListener('keydown', e => { if (e.target.dataset && e.target.dataset.k === 'code' && e.key === 'Enter') openCode(); });
  const codes = myCases();
  if (!codes.length) return;
  const { data, error } = await sb.from('casi').select('codice,stato,creato_il,accusa').in('codice', codes);
  if (error) err = true; else list = data || [];
  redraw();
}

/* ============ CREATORE ============ */
function Creator() {
  const S = { pins: { vittima: '', assassino: '', arma: '', stanza: '', movente: '' }, variant: 0, seed: Math.floor(Math.random() * 100000),
    clues: [], generated: false, armed: null, tokens: [], autore: '', code: null, sending: false };
  const allSet = () => Object.values(S.pins).every(Boolean) && S.pins.vittima !== S.pins.assassino;
  const roomName = id => byId(ROOMS, id).name;

  function resetGen() { if (S.generated) { S.generated = false; S.clues = []; S.tokens = []; S.armed = null; note('Parametri modificati: rigenerare i movimenti.', true); } }

  function applyToken(kind, target) {
    const t = S.armed; if (!t || S.tokens.length >= 2) return;
    const P = S.pins, tok = { type: t };
    const gone = k => S.clues.filter(c => c.kind === k && c.removed).length;
    if (t === 'pulizia') {
      if (kind !== 'clue') return;
      const c = S.clues.find(x => x.id === target); if (!c || c.removed) return;
      if (c.kind === 'falso') return note('Non si può rimuovere un movimento inserito con una rettifica.', true);
      if (c.kind === 'killer' && gone('killer') >= 1) return note('Rettifica respinta: devono restare almeno 3 tracce del responsabile.', true);
      if ((c.kind === 'scena' && gone('arma')) || (c.kind === 'arma' && gone('scena'))) return note('Rettifica respinta: l’ufficio del fatto deve restare riconoscibile.', true);
      if (c.kind === 'movente' && gone('movente') >= 1) return note('Rettifica respinta: deve restare almeno un documento di causale.', true);
      c.removed = true; tok.clueId = c.id; tok.label = 'Rimosso: ' + c.text;
    } else if (t === 'falso' || t === 'arma') {
      if (kind !== 'room') return;
      const nid = 'f' + Date.now();
      if (t === 'arma') {
        if (target === P.stanza) return note('Lo strumento è già nell’ufficio del fatto: scegliere un altro ufficio.', true);
        S.clues.push({ id: nid, room: target, text: 'Trovato qui: ' + byId(WEA, P.arma).name.toLowerCase(), tag: 'Rettifica · strumento spostato', kind: 'falso', removed: false });
        tok.label = 'Strumento spostato in ' + roomName(target);
      } else {
        const fakes = traitClues(byId(SUS, P.assassino), true);
        const used = S.tokens.filter(k => k.type === 'falso').length;
        const f = fakes[(S.seed + used * 2) % 4];
        S.clues.push({ id: nid, room: target, text: f.t, tag: 'Rettifica · traccia inserita', kind: 'falso', removed: false });
        tok.label = 'Inserito in ' + roomName(target) + ': ' + f.t;
      }
      tok.clueId = nid;
    }
    S.tokens.push(tok); S.armed = null; note('Rettifica applicata.'); redraw();
  }
  function undo(i) {
    const tok = S.tokens[i]; if (!tok) return;
    if (tok.type === 'pulizia') S.clues.forEach(c => { if (c.id === tok.clueId) c.removed = false; });
    if (tok.type === 'falso' || tok.type === 'arma') S.clues = S.clues.filter(c => c.id !== tok.clueId);
    S.tokens.splice(i, 1); redraw();
  }
  async function send() {
    if (S.sending || S.code) return;
    S.sending = true; setSaved('Invio in corso…');
    const caso = { pins: S.pins, variant: S.variant, seed: S.seed, clues: S.clues, tokens: S.tokens };
    const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    for (let attempt = 0; attempt < 5; attempt++) {
      const code = Array.from({ length: 6 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join('');
      const { error } = await sb.from('casi').insert({ codice: code, autore: S.autore.trim() || null, caso, indagine: { actions: 10 } });
      if (!error) { S.code = code; addMyCase(code); S.sending = false; setSaved('Salvato'); V.file = 'Pratica_' + code + '_bozza.xlsx'; note('Pratica inviata.'); return redraw(); }
      if (error.code !== '23505') { S.sending = false; setSaved('Non salvato'); return note('Invio non riuscito: ' + error.message, true); }
    }
    S.sending = false; setSaved('Non salvato'); note('Invio non riuscito: riprovare.', true);
  }

  function buildImp() {
    const P = S.pins, M = P.movente ? byId(MOT, P.movente) : null;
    const susOpts = SUS.map(p => [p.id, p.name + ' · ' + p.role]);
    const clash = P.vittima && P.vittima === P.assassino;
    const rows = [
      [C('PARAMETRI PRATICA', { b: true, span: 4 })],
      H(['Voce', 'Valore', 'Controllo', 'Note']),
      [C('Soggetto cessato'), C('', { html: selectHtml('vittima', susOpts, P.vittima) }), C(P.vittima ? 'OK' : '', { ok: true }), C('')],
      [C('Soggetto responsabile'), C('', { html: selectHtml('assassino', susOpts, P.assassino) }), C(clash ? 'Coincide con il cessato' : P.assassino ? 'OK' : '', { ok: !clash, err: clash }), C('')],
      [C('Strumento'), C('', { html: selectHtml('arma', WEA.map(w => [w.id, w.name]), P.arma) }), C(P.arma ? 'OK' : '', { ok: true }), C(P.arma ? (byId(WEA, P.arma).wound + ', ' + byId(WEA, P.arma).trace) : '', { muted: true })],
      [C('Ufficio del fatto'), C('', { html: selectHtml('stanza', ROOMS.map(r => [r.id, r.name]), P.stanza) }), C(P.stanza ? 'OK' : '', { ok: true }), C('')],
      [C('Causale'), C('', { html: selectHtml('movente', MOT.map(m => [m.id, m.name]), P.movente) }), C(P.movente ? 'OK' : '', { ok: true }), C(M ? M.desc : '', { muted: true })],
      [C('Variante causale'), M ? C('', { html: selectHtml('variant', M.v.map((v, i) => [i, (i + 1) + '. ' + v.t]), S.variant, 'Variante') }) : C('Selezionare prima la causale', { muted: true }), C(M ? 'OK' : '', { ok: true }), C('')],
      null,
      S.generated
        ? [C('Movimenti generati'), C(String(S.clues.length), { align: 'right' }), C('▸ Rigenera', { a: 'regen' }), C('▸ Vai al foglio Movimenti', { a: 'tomov' })]
        : [C(''), allSet() ? C('▸ Genera movimenti', { a: 'gen', b: true }) : C('Compilare tutti i parametri', { muted: true }), C(''), C('')],
      null,
      [C('PROCEDURA', { b: true, span: 4 })],
      [C('1. Compilare i parametri e generare i movimenti.', { muted: true, span: 4 })],
      [C('2. Nel foglio Movimenti applicare fino a 2 rettifiche.', { muted: true, span: 4 })],
      [C('3. Nel foglio Invio firmare e inviare la pratica, poi girare il link al collega.', { muted: true, span: 4 })],
      [C('Esc: passa al prospetto rate e ritorno.', { muted: true, span: 4 })]
    ];
    return { colW: [200, 340, 180, 520], rows };
  }

  function buildMov() {
    if (!S.generated) return { colW: [520], rows: [[C('MOVIMENTI', { b: true })], [C('Nessun movimento: generare dal foglio Impostazione.', { muted: true })], [C('▸ Vai al foglio Impostazione', { a: 'toimp' })]] };
    const used = t => S.tokens.some(k => k.type === t);
    const left = 2 - S.tokens.length;
    const RET = [['pulizia', 'Rimozione movimento', 'un movimento'], ['falso', 'Inserimento traccia', 'un ufficio'], ['arma', 'Spostamento strumento', 'un ufficio'], ['testimone', 'Testimone non attendibile', 'audizione vigilante']];
    const rows = [
      [C('RETTIFICHE', { b: true, span: 3 }), C('Residue: ' + left + ' / 2', { align: 'right' }), C(''), C('')],
      H(['Cod.', 'Rettifica', 'Si applica a', 'Stato', '', 'Operazione'])
    ];
    RET.forEach(([k, n, tgt], i) => {
      const dis = left <= 0 || ((k === 'arma' || k === 'testimone') && used(k));
      const armed = S.armed === k;
      rows.push([C('RET-0' + (i + 1)), C(n), C(tgt), C(armed ? 'In attesa di selezione' : used(k) ? 'Applicata' : '', { warn: armed }), C(''),
        dis ? C('') : armed ? C('▸ Annulla selezione', { a: 'disarm' }) : C(k === 'testimone' ? '▸ Applica' : '▸ Usa', { a: 'arm', id: k })]);
    });
    S.tokens.forEach((t, i) => rows.push([C('Applicata', { muted: true }), C(t.label, { span: 4 }), C('▸ Annulla', { a: 'undo', id: i })]));
    rows.push(null);
    rows.push([C('UFFICI', { b: true, span: 6 })]);
    rows.push(H(['Cod.', 'Ufficio', 'Movimenti', 'Note', '', 'Operazione']));
    const roomTarget = S.armed === 'falso' || S.armed === 'arma';
    ROOMS.forEach((r, i) => {
      rows.push([C('UFF-0' + (i + 1)), C(r.name), C(String(S.clues.filter(c => c.room === r.id && !c.removed).length), { align: 'right' }),
        C(r.id === S.pins.stanza ? 'Ufficio del fatto' : '', { muted: true }), C(''), roomTarget ? C('▸ Inserisci qui', { a: 'room', id: r.id }) : C('')]);
    });
    rows.push(null);
    rows.push([C('MOVIMENTI GENERATI', { b: true, span: 6 })]);
    rows.push(H(['Prog.', 'Ufficio', 'Classificazione', 'Descrizione', 'Stato', 'Operazione']));
    let prog = 0;
    ROOMS.forEach(r => S.clues.filter(c => c.room === r.id).forEach(c => {
      prog++;
      const st = c.kind === 'falso' ? 'Inserito' : c.removed ? 'Rimosso' : 'Attivo';
      rows.push([C(String(prog).padStart(3, '0'), { x: c.removed }), C(r.name, { x: c.removed }), C(c.tag, { x: c.removed }),
        C(c.text, { x: c.removed, strike: c.removed }), C(st, { warn: c.kind === 'falso', x: c.removed }),
        S.armed === 'pulizia' && !c.removed && c.kind !== 'falso' ? C('▸ Rimuovi', { a: 'clue', id: c.id }) : C('')]);
    }));
    return { colW: [80, 190, 200, 490, 100, 170], rows, minRows: 40 };
  }

  function buildInv() {
    const link = S.code ? baseUrl() + '?caso=' + S.code : '';
    const rows = [[C('INVIO PRATICA', { b: true, span: 3 })], H(['Voce', 'Valore', 'Operazione'])];
    if (!S.code) {
      rows.push([C('Firma (facoltativa)'), C('', { html: inputHtml('autore', S.autore, 'Nome o sigla', 30) }), C('')]);
      rows.push([C('Movimenti'), C(S.generated ? String(S.clues.filter(c => !c.removed).length) : 'Non generati', { muted: !S.generated }), C('')]);
      rows.push([C('Rettifiche applicate'), C(String(S.tokens.length) + ' / 2'), C('')]);
      rows.push(null);
      rows.push([C(''), S.generated ? C(S.sending ? 'Invio in corso…' : '▸ Invia pratica', { a: S.sending ? null : 'send', b: true }) : C('Generare prima i movimenti', { muted: true }), C('')]);
    } else {
      rows.push([C('Codice pratica'), C(S.code, { b: true }), C('')]);
      rows.push([C('Collegamento'), C(link), C('▸ Copia collegamento', { a: 'copy' })]);
      rows.push(null);
      rows.push([C(''), C('▸ Predisponi nuova pratica', { a: 'new' }), C('')]);
      rows.push([C(''), C('▸ Torna al registro', { a: 'home' }), C('')]);
    }
    return { colW: [200, 520, 220], rows };
  }

  openView({
    file: 'Pratica_nuova_bozza.xlsx', tabs: [['imp', 'Impostazione'], ['mov', 'Movimenti'], ['inv', 'Invio'], ['rate', 'Prospetto_rate']], tab: 'imp',
    build: t => t === 'mov' ? buildMov() : t === 'inv' ? buildInv() : buildImp(),
    status: () => S.generated ? 'Movimenti: ' + S.clues.filter(c => !c.removed).length + '   Rettifiche: ' + S.tokens.length + '/2' : 'Bozza',
    onInput: (k, v, ev) => {
      if (k === 'autore') { S.autore = v; return; }
      if (ev !== 'change') return;
      if (k === 'variant') { S.variant = +v || 0; resetGen(); return redraw(); }
      if (S.code) return;
      S.pins[k] = v;
      if (k === 'movente') S.variant = 0;
      resetGen(); redraw();
    },
    onAction: (a, id) => {
      if (a === 'gen' && allSet()) { S.clues = generate(S.pins, S.variant, S.seed); S.generated = true; S.tokens = []; V.tab = 'mov'; V.sel = 'A1'; note('Movimenti generati.'); draw(); }
      else if (a === 'regen') { S.seed++; S.clues = generate(S.pins, S.variant, S.seed); S.tokens = []; S.armed = null; note('Movimenti rigenerati, rettifiche azzerate.'); redraw(); }
      else if (a === 'tomov') goTab('mov');
      else if (a === 'toimp') goTab('imp');
      else if (a === 'arm') {
        if (id === 'testimone') { S.tokens.push({ type: 'testimone', label: 'Testimone non attendibile: il vigilante mentirà su un dettaglio' }); note('Rettifica applicata.'); return redraw(); }
        S.armed = id; note(id === 'pulizia' ? 'Selezionare il movimento da rimuovere.' : 'Selezionare l’ufficio in cui inserire.'); redraw();
      }
      else if (a === 'disarm') { S.armed = null; redraw(); }
      else if (a === 'undo') undo(+id);
      else if (a === 'room') applyToken('room', id);
      else if (a === 'clue') applyToken('clue', id);
      else if (a === 'send') send();
      else if (a === 'copy') navigator.clipboard.writeText(baseUrl() + '?caso=' + S.code).then(() => note('Collegamento copiato.'), () => note('Copia non riuscita: selezionare il testo a mano.', true));
      else if (a === 'new') go('crea');
      else if (a === 'home') go('');
    }
  });
}

/* ============ DETECTIVE ============ */
async function Detective(code) {
  openView({ file: 'Pratica_' + code + '_istruttoria.xlsx', tabs: [['anag', 'Anagrafica']], tab: 'anag', build: () => ({ colW: [400], rows: [[C('Caricamento pratica…', { muted: true })]] }) });
  const { data: row, error } = await sb.from('casi').select('*').eq('codice', code).maybeSingle();
  if (error || !row) {
    openView({ file: 'Pratica_' + code + '.xlsx', tabs: [['err', 'Foglio1'], ['rate', 'Prospetto_rate']], tab: 'err', onAction: a => { if (a === 'home') go(''); },
      build: () => ({ colW: [520], rows: [[C('Pratica ' + code + ' non trovata', { b: true })], [C('Verificare il codice ricevuto.', { muted: true })], null, [C('▸ Torna al registro', { a: 'home' })]] }) });
    return;
  }
  const caso = row.caso, P = caso.pins;
  const A = byId(SUS, P.assassino), W = byId(WEA, P.arma);
  const testimoneFalso = (caso.tokens || []).some(t => t.type === 'testimone');
  const I = Object.assign({ actions: 10, searched: [], marks: {}, autopsy: false, interrog: false, lab: [] }, row.indagine || {});
  if (I.crossed && !Object.keys(I.marks).length) I.crossed.forEach(id => I.marks[id] = 1);
  const pick = { chi: '', arma: '', stanza: '', movente: '' };
  let closed = row.stato !== 'aperto', accusa = row.accusa, showEsito = false, seedV = 0;
  const STATO = ['', 'Escluso', 'Da verificare'];
  const visible = () => caso.clues.filter(c => !c.removed);
  const tipo = c => ({ killer: 'Traccia', scena: 'Traccia', arma: 'Traccia', origine: 'Traccia', falso: 'Traccia', movente: 'Documento', segreto: 'Documento', neutro: 'Oggetto' })[c.kind];

  let saveQ = Promise.resolve();
  function save() {
    setSaved('Salvataggio…');
    saveQ = saveQ.then(async () => {
      const { error } = await sb.from('casi').update({ indagine: I, aggiornato_il: new Date().toISOString() }).eq('codice', code);
      if (error) { setSaved('Non salvato'); note('Salvataggio non riuscito: ricaricare la pagina.', true); } else setSaved('Salvato');
    });
  }
  function interrogText() {
    const at = ['scarpa', 'mano', 'fumo', 'capelli'][caso.seed % 4], lie = testimoneFalso;
    const shoe = lie ? (A.shoe === 'grande' ? 'piccole' : 'grandi') : ({ piccola: 'piccole', media: 'di misura media', grande: 'grandi' })[A.shoe];
    const sx = lie ? !A.sx : A.sx, smoke = lie ? !A.smoke : A.smoke, hair = lie ? (A.hair === 'biondo' ? 'scuri' : 'biondi') : HAIR_PL[A.hair];
    return {
      scarpa: 'Ricorda una persona con scarpe ' + shoe + ' in filiale dopo la chiusura',
      mano: 'Ha visto una persona aprire una porta con la mano ' + (sx ? 'sinistra' : 'destra'),
      fumo: smoke ? 'Riferisce odore di fumo in corridoio la sera prima' : 'Esclude che quella sera qualcuno abbia fumato',
      capelli: 'Ha intravisto una persona con capelli ' + hair + ' vicino all’ingresso'
    }[at];
  }
  const mark = id => I.marks[id] || 0;
  const statoCell = (id, g) => { const st = mark(id); return C((STATO[st] || '') + (closed ? '' : ' ▾'), { a: closed ? null : 'mark', id, warn: st === 2, x: st === 1, f: STATO[st] || '(vuoto)' }); };

  function buildAnag() {
    const V_ = byId(SUS, P.vittima);
    const rows = [[C('ANAGRAFICA SOGGETTI · Pratica ' + code, { b: true, span: 9 })],
      [C(row.autore ? 'Predisposta da ' + row.autore : '', { muted: true, span: 9 })],
      H(['Cod.', 'Nominativo', 'Qualifica', 'Calzatura', 'Mano', 'Fumatore', 'Capelli', 'Stato', 'Note'])];
    SUS.forEach((p, i) => {
      const vic = p.id === P.vittima, ex = !vic && mark(p.id) === 1;
      const o_ = { x: ex };
      rows.push([C('ANA-0' + (i + 1), o_), C(p.name.split(' ').reverse().join(' '), { x: ex, strike: ex }), C(p.role, o_),
        C(p.shoe[0].toUpperCase() + p.shoe.slice(1), Object.assign({ align: 'center' }, o_)), C(p.sx ? 'Sinistra' : 'Destra', Object.assign({ align: 'center' }, o_)),
        C(p.smoke ? 'Sì' : 'No', Object.assign({ align: 'center' }, o_)), C(HAIR_PL[p.hair][0].toUpperCase() + HAIR_PL[p.hair].slice(1), Object.assign({ align: 'center' }, o_)),
        vic ? C('Cessato', { muted: true }) : statoCell(p.id), C('')]);
    });
    rows.push(null, [C('STRUMENTI', { b: true, span: 9 })], H(['Cod.', 'Descrizione', 'Esito', 'Residuo', C('Provenienza', { span: 3 }), 'Stato', 'Note']));
    WEA.forEach((w, i) => {
      const ex = mark(w.id) === 1;
      rows.push([C('STR-0' + (i + 1), { x: ex }), C(w.name, { x: ex, strike: ex }), C(w.wound[0].toUpperCase() + w.wound.slice(1), { x: ex }),
        C(w.trace[0].toUpperCase() + w.trace.slice(1), { x: ex }), C(byId(ROOMS, w.origin).name, { x: ex, span: 3 }), statoCell(w.id), C('')]);
    });
    rows.push(null, [C('CAUSALI', { b: true, span: 9 })], H(['Cod.', 'Causale', C('Descrizione', { span: 5 }), 'Stato', 'Note']));
    MOT.forEach((m, i) => {
      const ex = mark(m.id) === 1;
      rows.push([C('CAU-0' + (i + 1), { x: ex }), C(m.name, { x: ex, strike: ex }), C(m.desc, { x: ex, span: 5 }), statoCell(m.id), C('')]);
    });
    return { colW: [72, 200, 150, 100, 90, 90, 90, 130, 260], rows, minRows: 34 };
  }

  function buildMov() {
    const rows = [[C('ESTRAZIONE MOVIMENTI PER UFFICIO', { b: true, span: 6 })], H(['Cod.', 'Ufficio', 'Stato', C('Costo', { align: 'right' }), 'Esito', 'Operazione'])];
    ROOMS.forEach((r, i) => {
      const done = I.searched.includes(r.id);
      rows.push([C('UFF-0' + (i + 1)), C(r.name), C(done ? 'Estratto' : 'Da estrarre', { muted: done }), C('1', { align: 'right' }),
        C(done ? visible().filter(c => c.room === r.id).length + ' movimenti' : '', { muted: true }),
        done || closed || I.actions < 1 ? C('') : C('▸ Estrai', { a: 'search', id: r.id })]);
    });
    rows.push(null, [C('ALTRE OPERAZIONI', { b: true, span: 6 })], H(['Cod.', 'Operazione', 'Stato', C('Costo', { align: 'right' }), 'Esito', 'Operazione']));
    rows.push([C('OP-01'), C('Referto medico'), C(I.autopsy ? 'Eseguito' : 'Da eseguire', { muted: I.autopsy }), C('1', { align: 'right' }),
      C(I.autopsy ? W.autopsy.charAt(0).toUpperCase() + W.autopsy.slice(1) : ''), I.autopsy || closed || I.actions < 1 ? C('') : C('▸ Esegui', { a: 'tool', id: 'autopsy' })]);
    rows.push([C('OP-02'), C('Audizione vigilante'), C(I.interrog ? 'Eseguito' : 'Da eseguire', { muted: I.interrog }), C('2', { align: 'right' }),
      C(I.interrog ? interrogText() : ''), I.interrog || closed || I.actions < 2 ? C('') : C('▸ Esegui', { a: 'tool', id: 'interrog' })]);
    rows.push(null, [C('MOVIMENTI ESTRATTI', { b: true, span: 6 })], H(['Prog.', 'Ufficio', 'Tipo', C('Costo', { align: 'right' }), 'Descrizione', 'Verifica']));
    let prog = 0;
    I.searched.forEach(rid => visible().filter(c => c.room === rid).forEach(c => {
      prog++;
      const v = I.lab.some(l => l.clueId === c.id);
      const verCell = v ? C(c.kind === 'falso' ? 'Non conforme' : 'Conforme', { err: c.kind === 'falso', ok: c.kind !== 'falso', b: c.kind === 'falso' })
        : closed || I.actions < 2 ? C('') : C('▸ Verifica (2)', { a: 'lab', id: c.id });
      rows.push([C(String(prog).padStart(3, '0')), C(byId(ROOMS, rid).name), C(tipo(c)), C(''), C(c.text), verCell]);
    }));
    if (!prog) rows.push([C(''), C('Nessun movimento: estrarre un ufficio dalla tabella in alto', { muted: true, span: 5 })]);
    return { colW: [72, 170, 120, 70, 600, 150], rows, minRows: 40 };
  }

  function buildRiep() {
    const rows = [[C('CHIUSURA PRATICA', { b: true, span: 4 })], H(['Voce', 'Valore', 'Esito', 'Note'])];
    const OPT = {
      chi: SUS.filter(p => p.id !== P.vittima).map(p => [p.id, p.name.split(' ').reverse().join(' ')]),
      arma: WEA.map(w => [w.id, w.name]), stanza: ROOMS.map(r => [r.id, r.name]), movente: MOT.map(m => [m.id, m.name])
    };
    const LAB = { chi: 'Soggetto', arma: 'Strumento', stanza: 'Ufficio', movente: 'Causale' };
    ['chi', 'arma', 'stanza', 'movente'].forEach(k => {
      if (closed && accusa) {
        const val = OPT[k].find(o => o[0] === accusa.scelta[k]);
        const ok = accusa.esatti[k];
        rows.push([C(LAB[k]), C(val ? val[1] : ''), C(ok ? 'Corretto' : 'Errato', { ok, err: !ok }), C('')]);
      } else rows.push([C(LAB[k]), C('', { html: selectHtml(k, OPT[k], pick[k]) }), C(''), C('')]);
    });
    rows.push(null);
    rows.push([C('Operazioni residue'), C(String(closed && accusa ? accusa.azioni_rimaste : I.actions), { align: 'right' }), C(''), C('')]);
    rows.push([C('Punteggio'), C(closed && accusa ? String(accusa.punti) : '', { align: 'right', b: true, f: '=SOMMA(ESATTI*3;RESIDUE)' }), C(''), C('')]);
    rows.push(null);
    if (!closed) {
      const ready = Object.values(pick).every(Boolean);
      rows.push([C(''), ready ? C('▸ Chiudi pratica', { a: 'close', b: true }) : C('Compilare tutte le voci', { muted: true }), C(''), C('Chiusura definitiva: una sola possibilità', { muted: true })]);
    } else {
      rows.push([C('Stato pratica'), C(row.stato === 'risolto' ? 'Chiusa · esito corretto' : 'Chiusa · esito errato', { ok: row.stato === 'risolto', err: row.stato !== 'risolto' }), C(''), C('')]);
      rows.push([C(''), C(showEsito ? '▸ Nascondi esito istruttoria' : '▸ Visualizza esito istruttoria', { a: 'esito' }), showEsito ? C('▸ Riformula', { a: 'rewrite' }) : C(''), C('▸ Predisponi nuova pratica', { a: 'new' })]);
      if (showEsito) rows.push(null, [C('ESITO ISTRUTTORIA', { b: true, span: 4 })], [C(verbale(caso, seedV), { wrap: true, span: 4 })]);
    }
    rows.push(null, [C('NOTE OPERATIVE', { b: true, span: 4 })],
      [C('I movimenti di tipo Traccia riguardano il soggetto responsabile, salvo rettifiche. I Documenti possono riguardare chiunque: rilevano solo quelli del responsabile. La verifica individua i movimenti inseriti.', { wrap: true, muted: true, span: 4 })],
      [C('Punteggio: 3 per ogni voce corretta, più le operazioni residue.', { muted: true, span: 4 })]);
    return { colW: [180, 300, 160, 460], rows };
  }

  async function accuse() {
    const ok = { chi: pick.chi === P.assassino, arma: pick.arma === P.arma, stanza: pick.stanza === P.stanza, movente: pick.movente === P.movente };
    const giusti = Object.values(ok).filter(Boolean).length;
    const acc = { scelta: Object.assign({}, pick), esatti: ok, giusti, punti: giusti * 3 + I.actions, azioni_rimaste: I.actions, il: new Date().toISOString() };
    const stato = giusti === 4 ? 'risolto' : 'fallito';
    setSaved('Salvataggio…');
    const { error } = await sb.from('casi').update({ accusa: acc, stato, indagine: I }).eq('codice', code).eq('stato', 'aperto');
    if (error) { setSaved('Non salvato'); return note('Chiusura non registrata: ' + error.message, true); }
    setSaved('Salvato'); accusa = acc; closed = true; row.stato = stato; note('Pratica chiusa.'); redraw();
  }

  openView({
    file: 'Pratica_' + code + '_istruttoria.xlsx', tabs: [['anag', 'Anagrafica'], ['mov', 'Movimenti'], ['riep', 'Riepilogo'], ['rate', 'Prospetto_rate']], tab: closed ? 'riep' : 'anag',
    build: t => t === 'mov' ? buildMov() : t === 'riep' ? buildRiep() : buildAnag(),
    status: () => 'Saldo operazioni: ' + (closed && accusa ? accusa.azioni_rimaste : I.actions) + '   Movimenti: ' + I.searched.reduce((n, r) => n + visible().filter(c => c.room === r).length, 0),
    onInput: (k, v, ev) => { if (ev === 'change' && k in pick) { pick[k] = v; redraw(); } },
    onAction: (a, id) => {
      if (a === 'esito') { showEsito = !showEsito; return redraw(); }
      if (a === 'rewrite') { seedV++; return redraw(); }
      if (a === 'new') return go('crea');
      if (closed) return;
      if (a === 'search') { if (I.searched.includes(id) || I.actions < 1) return; I.searched.push(id); I.actions -= 1; redraw(); save(); }
      else if (a === 'tool') { const cost = id === 'autopsy' ? 1 : 2; if (I[id] || I.actions < cost) return; I[id] = true; I.actions -= cost; redraw(); save(); }
      else if (a === 'lab') { if (I.lab.some(l => l.clueId === id) || I.actions < 2) return; I.lab.push({ clueId: id }); I.actions -= 2; redraw(); save(); }
      else if (a === 'mark') { I.marks[id] = (mark(id) + 1) % 3; redraw(); save(); }
      else if (a === 'close') accuse();
    }
  });
}
