function generate(pins, variant, seed) {
  let x = seed * 7919 + 13;

  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

      const f = c.f != null ? c.f : (c.t == null ? '' : String(c.t));

function rateSheet() {
  const Cap = 180000, r = 0.032 / 12, N = 300, R = Cap * r / (1 - Math.pow(1 + r, -N));
  const eur = v => v.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const rows = [
    [C('PROSPETTO RATE MUTUO · simulazione cliente', { b: true, span: 6 })],
    [C('Capitale'), C(eur(Cap), { align: 'right' }), C('Tasso annuo'), C('3,20%', { align: 'right' }), C('Durata'), C('25 anni', { align: 'right' })],
    null,
    H(['N. rata', 'Scadenza', C('Rata', { align: 'right' }), C('Quota interessi', { align: 'right' }), C('Quota capitale', { align: 'right' }), C('Debito residuo', { align: 'right' })])
  ];
  let debt = Cap;
  for (let i = 1; i <= 28; i++) {
    const it = debt * r, cp = R - it; debt -= cp;
    const m = (9 + i) % 12, y = 2026 + Math.floor((9 + i) / 12);
    rows.push([C(String(i), { align: 'right' }), C('01/' + String(m + 1).padStart(2, '0') + '/' + y), C(eur(R), { align: 'right', f: '=RATA(3,2%/12;300;-180000)' }),
      C(eur(it), { align: 'right' }), C(eur(cp), { align: 'right' }), C(eur(debt), { align: 'right' })]);
  }
  return { colW: [90, 120, 130, 150, 150, 160], rows };
}

    });

  }

  openView({
    file: 'Registro_pratiche.xlsx', tabs: [['reg', 'Registro'], ['rate', 'Prospetto_rate']], tab: 'reg', build,
    status: () => 'Pratiche: ' + myCases().length,

function spanOf(cells) { return (cells || []).reduce((n, c) => n + (c.span || 1), 0); }
function pad(cells, n) { const r = (cells || []).slice(); let k = spanOf(r); while (k < n) { r.push(C('')); k++; } return r; }
function zip(left, nL, right) {
  const out = [], n = Math.max(left.length, right.length);
  for (let i = 0; i < n; i++) out.push(pad(left[i], nL).concat([C('', { gap: true })], right[i] || []));
  return out;
}

/* ============ CREATORE ============ */
function Creator() {
  const S = { pins: { vittima: '', assassino: '', arma: '', stanza: '', movente: '' }, variant: 0, seed: Math.floor(Math.random() * 100000),
    clues: [], generated: false, armed: null, tokens: [], autore: '', code: null, sending: false, flash: '' };
  const clash = () => S.pins.vittima && S.pins.vittima === S.pins.assassino;
  const allSet = () => Object.values(S.pins).every(Boolean) && !clash();
  const roomName = id => byId(ROOMS, id).name;
  const flash = t => { S.flash = t; };

  function resetGen() { if (S.generated) { S.generated = false; S.clues = []; S.tokens = []; S.armed = null; flash('Parametri modificati: i movimenti vanno rigenerati.'); } }

  function applyToken(kind, target) {
    const t = S.armed; if (!t || S.tokens.length >= 2) return;
    const P = S.pins, tok = { type: t };
    const gone = k => S.clues.filter(c => c.kind === k && c.removed).length;
    const reject = m => { flash(m); redraw(); };
    if (t === 'pulizia') {
      const c = S.clues.find(x => x.id === target); if (!c || c.removed) return;
      if (c.kind === 'killer' && gone('killer') >= 1) return reject('Rettifica respinta: devono restare almeno 3 tracce del responsabile, altrimenti il caso è irrisolvibile.');
      if ((c.kind === 'scena' && gone('arma')) || (c.kind === 'arma' && gone('scena'))) return reject('Rettifica respinta: l’ufficio del fatto deve restare riconoscibile da almeno un movimento.');
      if (c.kind === 'movente' && gone('movente') >= 1) return reject('Rettifica respinta: deve restare almeno un documento di causale.');
      c.removed = true; tok.clueId = c.id; tok.label = 'Rimosso: ' + c.text;
    } else {
      const nid = 'f' + Date.now();
      if (t === 'arma') {
        if (target === P.stanza) return reject('Lo strumento è già nell’ufficio del fatto: sceglierne un altro.');
        S.clues.push({ id: nid, room: target, text: 'Trovato qui: ' + byId(WEA, P.arma).name.charAt(0).toLowerCase() + byId(WEA, P.arma).name.slice(1), tag: 'Rettifica · strumento spostato', kind: 'falso', removed: false });
        tok.label = 'Strumento spostato in ' + roomName(target);
      } else {
        const fakes = traitClues(byId(SUS, P.assassino), true);
        const f = fakes[(S.seed + S.tokens.filter(k => k.type === 'falso').length * 2) % 4];
        S.clues.push({ id: nid, room: target, text: f.t, tag: 'Rettifica · traccia inserita', kind: 'falso', removed: false });
        tok.label = 'Inserito in ' + roomName(target) + ': ' + f.t;
      }
      tok.clueId = nid;
    }
    S.tokens.push(tok); S.armed = null; flash('Rettifica applicata. ' + (S.tokens.length < 2 ? 'Ne resta una.' : 'Rettifiche esaurite: firma e invia la pratica in basso a sinistra.')); redraw();
  }
  function undo(i) {
    const tok = S.tokens[i]; if (!tok) return;
    if (tok.type === 'pulizia') S.clues.forEach(c => { if (c.id === tok.clueId) c.removed = false; });
    if (tok.type === 'falso' || tok.type === 'arma') S.clues = S.clues.filter(c => c.id !== tok.clueId);
    S.tokens.splice(i, 1); flash('Rettifica annullata.'); redraw();
  }
  async function send() {
    if (S.sending || S.code) return;
    S.sending = true; setSaved('Invio in corso…'); redraw();
    const caso = { pins: S.pins, variant: S.variant, seed: S.seed, clues: S.clues, tokens: S.tokens };
    const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    for (let attempt = 0; attempt < 5; attempt++) {
      const code = Array.from({ length: 6 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join('');
      const { error } = await sb.from('casi').insert({ codice: code, autore: S.autore.trim() || null, caso, indagine: { actions: 7, max: 7 } });
      if (!error) { S.code = code; addMyCase(code); S.sending = false; setSaved('Salvato'); V.file = 'Pratica_' + code + '.xlsx'; flash('Pratica inviata: copia il collegamento e giralo al collega.'); return redraw(); }
      if (error.code !== '23505') { S.sending = false; setSaved('Non salvato'); flash('Invio non riuscito: ' + error.message); return redraw(); }
    }
    S.sending = false; setSaved('Non salvato'); flash('Invio non riuscito: riprovare.'); redraw();
  }

  function tip() {
    if (S.flash) return S.flash;
    if (S.code) return 'Pratica inviata: copia il collegamento (in basso a sinistra) e giralo al collega.';
    if (clash()) return 'Il soggetto responsabile non può coincidere con il cessato.';
    if (!allSet()) return 'Compila i parametri qui a sinistra con i menu a tendina: chi muore, chi è stato, con cosa, dove e perché.';
    if (!S.generated) return 'Parametri completi: premi «▸ Genera movimenti» sotto i parametri.';
    if (S.armed === 'pulizia') return 'Scegli a destra, nella tabella Movimenti generati, il movimento da rimuovere («▸ Rimuovi»).';
    if (S.armed) return 'Scegli a destra, nella tabella Uffici, dove inserire («▸ Inserisci qui»).';
    if (S.tokens.length < 2) return 'Movimenti generati (a destra). Puoi applicare fino a 2 rettifiche per depistare il collega, poi firma e invia in basso a sinistra.';
    return 'Rettifiche esaurite: firma e invia la pratica in basso a sinistra.';
  }

  const NL = 3, COLW = [160, 290, 90, 12, 140, 150, 360, 80, 110];
  function build() {
    const P = S.pins, M = P.movente ? byId(MOT, P.movente) : null, left_ = 2 - S.tokens.length;
    const frozen = [
      [C(S.code ? 'Pratica ' + S.code : 'Nuova pratica · bozza', { b: true, span: 2 }), C(S.code ? 'Inviata' : S.generated ? 'Generata' : 'Bozza', { muted: true }), C('', { gap: true }),
        C('Rettifiche residue', { h: true }), C(left_ + ' / 2', { kpi: true, low: left_ === 0 }), C('Movimenti attivi: ' + S.clues.filter(c => !c.removed).length, { muted: true, span: 3 })],
      [C(tip(), { tip: true, span: 9 })]
    ];
    const top = [];
    if (S.generated) top.push([C('RELAZIONE DI SERVIZIO · anteprima', { b: true, span: 9 })], [C(relazione({ pins: P, seed: S.seed }), { wrap: true, muted: true, span: 9 })], null);

    const susOpts = SUS.map(p => [p.id, p.name + ' · ' + p.role]);
    const okc = v => C(v ? 'OK' : '', { ok: true });
    const L = [
      [C('PARAMETRI', { b: true, span: 3 })],
      H(['Voce', 'Valore', 'Controllo']),
      [C('Vittima'), C('', { html: selectHtml('vittima', susOpts, P.vittima) }), okc(P.vittima)],
      [C('Assassino'), C('', { html: selectHtml('assassino', susOpts, P.assassino) }), clash() ? C('= vittima', { err: true }) : okc(P.assassino)],
      [C('Arma'), C('', { html: selectHtml('arma', WEA_ATTIVE.map(w => [w.id, w.name + ' (' + w.wound + ', ' + w.trace + ')']), P.arma) }), okc(P.arma)],
      [C('Stanza del delitto'), C('', { html: selectHtml('stanza', ROOMS.map(r => [r.id, r.name]), P.stanza) }), okc(P.stanza)],
      [C('Movente'), C('', { html: selectHtml('movente', MOT.map(m => [m.id, m.name]), P.movente) }), okc(P.movente)],
      [C('Storia del movente'), M ? C('', { html: selectHtml('variant', M.v.map((v, i) => [i, v.t]), S.variant, 'Storia') }) : C('Scegli prima il movente', { muted: true }), okc(M)],
      null,
      S.code ? [C('')] : S.generated ? [C('Movimenti'), C('▸ Rigenera (azzera le rettifiche)', { a: 'regen' }), C('')]
        : [C(''), allSet() ? C('▸ Genera movimenti', { a: 'gen', b: true }) : C('Compila tutti i parametri', { muted: true }), C('')],
      null,
      [C('INVIO', { b: true, span: 3 })]
    ];
    if (!S.code) {
      L.push([C('Firma (facoltativa)'), C('', { html: inputHtml('autore', S.autore, 'Nome o sigla', 30) }), C('')]);
      L.push([C(''), S.generated ? C(S.sending ? 'Invio in corso…' : '▸ Invia pratica al collega', { a: S.sending ? null : 'send', b: true }) : C('Prima genera i movimenti', { muted: true }), C('')]);
    } else {
      L.push([C('Codice pratica'), C(S.code, { b: true }), C('')]);
      L.push([C('Collegamento'), C(baseUrl() + '?caso=' + S.code), C('▸ Copia', { a: 'copy' })]);
      L.push([C(''), C('▸ Predisponi nuova pratica', { a: 'new' }), C('')]);
      L.push([C(''), C('▸ Torna al registro', { a: 'home' }), C('')]);
    }

    const R = [];
    if (!S.generated) {
      R.push([C('MOVIMENTI', { b: true, span: 5 })], [C('Compaiono qui dopo «▸ Genera movimenti».', { muted: true, span: 5 })]);
    } else {
      const used = t => S.tokens.some(k => k.type === t);
      R.push([C('RETTIFICHE (depistaggio)', { b: true, span: 5 })], H([C('Rettifica', { span: 2 }), 'Effetto', 'Stato', 'Operazione']));
      [['pulizia', 'Rimozione movimento', 'Fa sparire un movimento vero'], ['falso', 'Inserimento traccia', 'Aggiunge una traccia falsa in un ufficio'],
       ['arma', 'Spostamento arma', 'L’arma viene trovata in un altro ufficio'], ['testimone', 'Testimone inattendibile', 'Il vigilante mentirà su un dettaglio']].forEach(([k, n, e]) => {
        const dis = S.code || left_ <= 0 || ((k === 'arma' || k === 'testimone') && used(k));
        const armed = S.armed === k;
        R.push([C(n, { span: 2 }), C(e, { muted: true }), C(armed ? 'Scegli…' : used(k) ? 'Applicata' : '', { warn: armed, ok: !armed && used(k) }),
          dis ? C('') : armed ? C('▸ Annulla', { a: 'disarm' }) : C(k === 'testimone' ? '▸ Applica' : '▸ Usa', { a: 'arm', id: k })]);
      });
      S.tokens.forEach((t, i) => R.push([C('Applicata', { muted: true }), C(t.label, { span: 3 }), S.code ? C('') : C('▸ Annulla', { a: 'undo', id: i })]));
      R.push(null, [C('UFFICI', { b: true, span: 5 })], H(['Ufficio', 'Movimenti', 'Note', '', 'Operazione']));
      const roomTarget = S.armed === 'falso' || S.armed === 'arma';
      ROOMS.forEach(r => R.push([C(r.name), C(String(S.clues.filter(c => c.room === r.id && !c.removed).length), { align: 'right' }),
        C(r.id === P.stanza ? 'Stanza del delitto' : '', { muted: true }), C(''), roomTarget ? C('▸ Inserisci qui', { a: 'room', id: r.id }) : C('')]));
      R.push(null, [C('MOVIMENTI GENERATI', { b: true, span: 5 })], H(['Ufficio', 'Classificazione', 'Descrizione', 'Stato', 'Operazione']));
      ROOMS.forEach(r => S.clues.filter(c => c.room === r.id).forEach(c => {
        R.push([C(r.name, { x: c.removed }), C(c.tag, { x: c.removed }), C(c.text, { x: c.removed, strike: c.removed, wrap: true }),
          C(c.kind === 'falso' ? 'Inserito' : c.removed ? 'Rimosso' : 'Attivo', { warn: c.kind === 'falso', x: c.removed }),
          S.armed === 'pulizia' && !c.removed && c.kind !== 'falso' ? C('▸ Rimuovi', { a: 'clue', id: c.id }) : C('')]);
      }));
    }
    return { colW: COLW, frozen: 2, rows: frozen.concat(top, zip(L, NL, R)), minRows: 40 };
  }

  openView({
    file: 'Pratica_nuova_bozza.xlsx', tabs: [['pra', 'Pratica'], ['rate', 'Prospetto_rate']], tab: 'pra', build,
    status: () => S.generated ? 'Movimenti: ' + S.clues.filter(c => !c.removed).length + '   Rettifiche residue: ' + (2 - S.tokens.length) : 'Bozza',
    onInput: (k, v, ev) => {
      if (k === 'autore') { S.autore = v; return; }
      if (ev !== 'change' || S.code) return;
      S.flash = '';
      if (k === 'variant') { S.variant = +v || 0; resetGen(); return redraw(); }
      S.pins[k] = v;
      if (k === 'movente') S.variant = 0;
      resetGen(); redraw();
    },
    onAction: (a, id) => {
      S.flash = '';
      if (a === 'gen' && allSet()) { S.clues = generate(S.pins, S.variant, S.seed); S.generated = true; S.tokens = []; flash('Movimenti generati: li vedi a destra. Ora puoi depistare con le rettifiche.'); redraw(); }
      else if (a === 'regen') { S.seed++; S.clues = generate(S.pins, S.variant, S.seed); S.tokens = []; S.armed = null; flash('Movimenti rigenerati, rettifiche azzerate.'); redraw(); }
      else if (a === 'arm') {
        if (id === 'testimone') { S.tokens.push({ type: 'testimone', label: 'Testimone inattendibile: il vigilante mentirà su un dettaglio' }); flash('Rettifica applicata.'); return redraw(); }
        S.armed = id; redraw();
      }
      else if (a === 'disarm') { S.armed = null; redraw(); }
      else if (a === 'undo') undo(+id);
      else if (a === 'room') applyToken('room', id);
      else if (a === 'clue') applyToken('clue', id);
      else if (a === 'send') send();
      else if (a === 'copy') navigator.clipboard.writeText(baseUrl() + '?caso=' + S.code).then(() => { flash('Collegamento copiato.'); redraw(); }, () => { flash('Copia non riuscita: seleziona la cella e copia il testo dalla barra della formula.'); redraw(); });
      else if (a === 'new') go('crea');
      else if (a === 'home') go('');
    }
  });
}

/* ============ DETECTIVE ============ */
async function Detective(code) {
  openView({ file: 'Pratica_' + code + '.xlsx', tabs: [['ist', 'Istruttoria']], tab: 'ist', build: () => ({ colW: [400], rows: [[C('Caricamento pratica…', { muted: true })]] }) });
  const { data: row, error } = await sb.from('casi').select('*').eq('codice', code).maybeSingle();
  if (error || !row) {
    openView({ file: 'Pratica_' + code + '.xlsx', tabs: [['err', 'Foglio1'], ['rate', 'Prospetto_rate']], tab: 'err', onAction: a => { if (a === 'home') go(''); },
      build: () => ({ colW: [520], rows: [[C('Pratica ' + code + ' non trovata', { b: true })], [C('Verificare il codice ricevuto.', { muted: true })], null, [C('▸ Torna al registro', { a: 'home' })]] }) });
    return;
  }
  const caso = row.caso, P = caso.pins;
  const A = byId(SUS, P.assassino), W = byId(WEA, P.arma);
  const testimoneFalso = (caso.tokens || []).some(t => t.type === 'testimone');
  const I = Object.assign({ actions: 10, searched: [], marks: {}, autopsy: false, interrog: false, lab: [] }, row.indagine || {});
  if (I.crossed && !Object.keys(I.marks).length) I.crossed.forEach(id => I.marks[id] = 1);
  const pick = { chi: '', arma: '', stanza: '', movente: '' };
  let closed = row.stato !== 'aperto', accusa = row.accusa, showEsito = false, seedV = 0, flashT = '', lastRoom = null;
  const STATO = ['—', 'Escluso', 'Da verificare'];
  const visible = () => caso.clues.filter(c => !c.removed);
  const tipo = c => ({ killer: 'Traccia', scena: 'Traccia', arma: 'Traccia', origine: 'Traccia', falso: 'Traccia', movente: 'Documento', segreto: 'Documento', neutro: 'Oggetto' })[c.kind];
  const ops = () => closed && accusa ? accusa.azioni_rimaste : I.actions;
  const MAX = I.max || 10;
  const ARMI = WEA.filter(w => !w.legacy || w.id === P.arma);

  let saveQ = Promise.resolve();
  function save() {
    setSaved('Salvataggio…');
    saveQ = saveQ.then(async () => {
      const { error } = await sb.from('casi').update({ indagine: I, aggiornato_il: new Date().toISOString() }).eq('codice', code);
      if (error) { setSaved('Non salvato'); note('Salvataggio non riuscito: ricaricare la pagina.', true); } else setSaved('Salvato');
    });
  }
  function interrogText() {
    const at = ['scarpa', 'mano', 'fumo', 'capelli'][caso.seed % 4], lie = testimoneFalso;
    const shoe = lie ? (A.shoe === 'grande' ? 'piccole' : 'grandi') : ({ piccola: 'piccole', media: 'di misura media', grande: 'grandi' })[A.shoe];
    const sx = lie ? !A.sx : A.sx, smoke = lie ? !A.smoke : A.smoke, hair = lie ? (A.hair === 'biondo' ? 'scuri' : 'biondi') : HAIR_PL[A.hair];
    return {
      scarpa: 'Ricorda una persona con scarpe ' + shoe + ' in filiale dopo la chiusura',
      mano: 'Ha visto una persona aprire una porta con la mano ' + (sx ? 'sinistra' : 'destra'),
      fumo: smoke ? 'Riferisce odore di fumo in corridoio la sera prima' : 'Esclude che quella sera qualcuno abbia fumato',
      capelli: 'Ha intravisto una persona con capelli ' + hair + ' vicino all’ingresso'
    }[at];
  }
  function tip() {
    if (flashT) return flashT;
    if (closed) return 'Pratica chiusa: esito e punteggio nel foglio Chiusura (in basso). Poi tocca a te: predisponi una pratica per il collega.';
    if (V.tab === 'chi') return 'Scegli soggetto, arma, stanza e movente dai menu, poi «▸ Chiudi pratica». Hai una sola possibilità: ogni voce giusta vale 3 punti, ogni operazione avanzata 1.';
    if (!I.searched.length) return 'Da dove iniziare: nella tabella Uffici a destra premi «▸ Estrai» (costa 1 operazione). Poi confronta le tracce trovate con le colonne dei soggetti qui a sinistra.';
    if (I.actions === 0) return 'Operazioni esaurite: passa al foglio Chiusura (scheda in basso) per chiudere la pratica.';
    if (I.actions <= 2) return 'Restano ' + I.actions + ' operazioni. Quando hai un’idea chiara, chiudi la pratica nel foglio Chiusura (scheda in basso): le operazioni avanzate valgono punti.';
    return 'Segna i soggetti con la colonna Stato (clic: Escluso / Da verificare). Le Tracce riguardano l’assassino; i Documenti possono riguardare chiunque, contano solo quelli dell’assassino.';
  }
  const mark = id => I.marks[id] || 0;
  const statoCell = id => { const st = mark(id); return C(STATO[st] + (closed ? '' : ' ▾'), { a: closed ? null : 'mark', id, warn: st === 2, x: st === 1, muted: st === 0, f: st ? STATO[st] : 'Clic per segnare: Escluso / Da verificare' }); };

  function frozenRows(colsLeft, total) {
    const low = ops() <= 2;
    const stato = closed ? (row.stato === 'risolto' ? 'Chiusa · esito corretto' : 'Chiusa · esito errato') : 'In istruttoria';
    return [
      [C('Pratica ' + code + (row.autore ? ' · da ' + row.autore : ''), { b: true, span: colsLeft === 7 ? 2 : 1 }), C('Operazioni residue', { h: true, span: colsLeft === 7 ? 2 : 1 }),
        C(ops() + ' / ' + MAX, { kpi: true, low, span: colsLeft === 7 ? 2 : 1 }), C(stato, { ok: row.stato === 'risolto', err: row.stato === 'fallito', muted: !closed })],
      [C(tip(), { tip: true, span: total })]
    ];
  }

  const NL = 7, COLW = [165, 120, 75, 75, 70, 75, 110, 12, 130, 85, 370, 115];
  function buildIst() {
    const top = [[C('RELAZIONE DI SERVIZIO', { b: true, span: 12 })], [C(relazione(caso), { wrap: true, span: 12 })], null];
    const L = [[C('SOGGETTI', { b: true, span: 7 })], H(['Nominativo', 'Qualifica', 'Scarpa', 'Mano', 'Fuma', 'Capelli', 'Stato'])];
    SUS.forEach(p => {
      const vic = p.id === P.vittima, ex = !vic && mark(p.id) === 1, o_ = { x: ex, align: 'center' };
      L.push([C(p.name.split(' ').reverse().join(' '), { x: ex || vic, strike: ex }), C(p.role, { x: ex || vic }), C(cap(p.shoe), o_), C(p.sx ? 'Sinistra' : 'Destra', o_),
        C(p.smoke ? 'Sì' : 'No', o_), C(cap(HAIR_PL[p.hair]), o_), vic ? C('Vittima', { muted: true }) : statoCell(p.id)]);
    });
    L.push(null, [C('ARMI', { b: true, span: 7 })], H(['Descrizione', 'Ferita', C('Traccia', { span: 2 }), C('Proviene da', { span: 2 }), 'Stato']));
    ARMI.forEach(w => { const ex = mark(w.id) === 1; L.push([C(w.name, { x: ex, strike: ex }), C(cap(w.wound), { x: ex }), C(cap(w.trace), { x: ex, span: 2 }), C(byId(ROOMS, w.origin).name, { x: ex, span: 2 }), statoCell(w.id)]); });
    L.push(null, [C('MOVENTI', { b: true, span: 7 })], H(['Movente', C('Descrizione', { span: 5 }), 'Stato']));
    MOT.forEach(m => { const ex = mark(m.id) === 1; L.push([C(m.name, { x: ex, strike: ex }), C(m.desc, { x: ex, span: 5 }), statoCell(m.id)]); });

    const R = [[C('UFFICI', { b: true, span: 4 })], H(['Ufficio', 'Costo', 'Esito', 'Operazione'])];
    ROOMS.forEach(r => {
      const done = I.searched.includes(r.id);
      R.push([C(r.name), C('1 op.', { muted: true }), C(done ? 'Estratto: ' + visible().filter(c => c.room === r.id).length + ' movimenti' : '', { muted: true }),
        done || closed || I.actions < 1 ? C('') : C('▸ Estrai', { a: 'search', id: r.id })]);
    });
    R.push(null, [C('ALTRE OPERAZIONI', { b: true, span: 4 })], H(['Operazione', 'Costo', 'Esito', '']));
    R.push([C('Referto medico'), C('1 op.', { muted: true }), C(I.autopsy ? cap(W.autopsy) : 'Rivela il tipo di ferita', { muted: !I.autopsy, wrap: I.autopsy }), I.autopsy || closed || I.actions < 1 ? C('') : C('▸ Esegui', { a: 'tool', id: 'autopsy' })]);
    R.push([C('Audizione vigilante'), C('2 op.', { muted: true }), C(I.interrog ? interrogText() : 'Un testimone ricorda un dettaglio', { muted: !I.interrog, wrap: I.interrog }), I.interrog || closed || I.actions < 2 ? C('') : C('▸ Esegui', { a: 'tool', id: 'interrog' })]);
    R.push(null, [C('MOVIMENTI ESTRATTI', { b: true, span: 4 })], H(['Ufficio', 'Tipo', 'Descrizione', 'Verifica (2 op.)']));
    let n = 0;
    I.searched.forEach(rid => visible().filter(c => c.room === rid).forEach(c => {
      n++;
      const v = I.lab.some(l => l.clueId === c.id), hl = rid === lastRoom;
      const ver = v ? C(c.kind === 'falso' ? 'Non conforme' : 'Conforme', { err: c.kind === 'falso', ok: c.kind !== 'falso', b: c.kind === 'falso', hl })
        : closed || I.actions < 2 ? C('', { hl }) : C('▸ Verifica', { a: 'lab', id: c.id, hl });
      R.push([C(byId(ROOMS, rid).name, { hl }), C(tipo(c), { hl, b: tipo(c) === 'Traccia' }), C(c.text, { wrap: true, hl }), ver]);
    }));
    if (!n) R.push([C('Nessun movimento: premi «▸ Estrai» su un ufficio qui sopra.', { muted: true, span: 4 })]);
    return { colW: COLW, frozen: 2, rows: frozenRows(7, 12).concat(top, zip(L, NL, R)), minRows: 44 };
  }

  function buildChi() {
    const COL = [180, 300, 160, 460];
    const rows = frozenRows(1, 4).concat([[C('CHIUSURA PRATICA', { b: true, span: 4 })], H(['Voce', 'La tua scelta', 'Esito', 'Note'])]);
    const OPT = { chi: SUS.filter(p => p.id !== P.vittima).map(p => [p.id, p.name.split(' ').reverse().join(' ')]), arma: ARMI.map(w => [w.id, w.name]), stanza: ROOMS.map(r => [r.id, r.name]), movente: MOT.map(m => [m.id, m.name]) };
    const LAB = { chi: 'Assassino', arma: 'Arma', stanza: 'Stanza del delitto', movente: 'Movente' };
    ['chi', 'arma', 'stanza', 'movente'].forEach(k => {
      if (closed && accusa) {
        const val = OPT[k].find(o_ => o_[0] === accusa.scelta[k]), ok = accusa.esatti[k];
        rows.push([C(LAB[k]), C(val ? val[1] : ''), C(ok ? 'Corretto' : 'Errato', { ok, err: !ok }), C('')]);
      } else rows.push([C(LAB[k]), C('', { html: selectHtml(k, OPT[k], pick[k]) }), C(''), C('')]);
    });
    rows.push(null);
    if (!closed) {
      const ready = Object.values(pick).every(Boolean);
      rows.push([C(''), ready ? C('▸ Chiudi pratica', { a: 'close', b: true }) : C('Compila tutte e quattro le voci', { muted: true }), C(''), C('Chiusura definitiva: una sola possibilità', { muted: true })]);
    } else {
      rows.push([C('Punteggio'), C(String(accusa ? accusa.punti : ''), { b: true, align: 'right', f: '=SOMMA(ESATTI*3;RESIDUE)' }), C(accusa ? accusa.giusti + ' voci su 4 + ' + accusa.azioni_rimaste + ' operazioni' : '', { muted: true, wrap: true }), C('')]);
      rows.push([C(''), C(showEsito ? '▸ Nascondi esito istruttoria' : '▸ Visualizza esito istruttoria', { a: 'esito', b: true }), showEsito ? C('▸ Riformula', { a: 'rewrite' }) : C(''), C('▸ Ora tocca a te: predisponi una pratica', { a: 'new' })]);
      if (showEsito) rows.push(null, [C('ESITO ISTRUTTORIA', { b: true, span: 4 })], [C(verbale(caso, seedV), { wrap: true, span: 4 })], [C(epilogo(caso, row.stato === 'risolto', seedV), { wrap: true, span: 4, b: true })]);
    }
    rows.push(null, [C('NOTE OPERATIVE', { b: true, span: 4 })],
      [C('Le Tracce trovate negli uffici riguardano l’assassino, salvo rettifiche del collega. I Documenti possono riguardare chiunque: contano solo quelli dell’assassino. La Verifica scopre i movimenti inseriti ad arte.', { wrap: true, muted: true, span: 4 })],
      [C('Punteggio: 3 per ogni voce corretta, più le operazioni residue. Tasto Esc: passa al prospetto rate e ritorno.', { wrap: true, muted: true, span: 4 })]);
    return { colW: COL, frozen: 2, rows };
  }

  async function accuse() {
    const ok = { chi: pick.chi === P.assassino, arma: pick.arma === P.arma, stanza: pick.stanza === P.stanza, movente: pick.movente === P.movente };
    const giusti = Object.values(ok).filter(Boolean).length;
    const acc = { scelta: Object.assign({}, pick), esatti: ok, giusti, punti: giusti * 3 + I.actions, azioni_rimaste: I.actions, il: new Date().toISOString() };
    const stato = giusti === 4 ? 'risolto' : 'fallito';
    setSaved('Salvataggio…');
    const { error } = await sb.from('casi').update({ accusa: acc, stato, indagine: I }).eq('codice', code).eq('stato', 'aperto');
    if (error) { setSaved('Non salvato'); flashT = 'Chiusura non registrata: ' + error.message; return redraw(); }
    setSaved('Salvato'); accusa = acc; closed = true; row.stato = stato; showEsito = true;
    flashT = stato === 'risolto' ? 'Pratica chiusa con esito corretto. Leggi l’esito istruttoria qui sotto.' : 'Pratica chiusa con esito errato. L’esito istruttoria qui sotto racconta come è andata davvero.';
    redraw();
  }

  openView({
    file: 'Pratica_' + code + '_istruttoria.xlsx', tabs: [['ist', 'Istruttoria'], ['chi', 'Chiusura'], ['rate', 'Prospetto_rate']], tab: closed ? 'chi' : 'ist',
    build: t => t === 'chi' ? buildChi() : buildIst(),
    status: () => 'Operazioni residue: ' + ops() + ' / ' + MAX + '   Movimenti: ' + I.searched.reduce((n, r) => n + visible().filter(c => c.room === r).length, 0),
    onInput: (k, v, ev) => { if (ev === 'change' && k in pick) { pick[k] = v; flashT = ''; redraw(); } },
    onAction: (a, id) => {
      flashT = '';
      if (a === 'esito') { showEsito = !showEsito; return redraw(); }
      if (a === 'rewrite') { seedV++; return redraw(); }
      if (a === 'new') return go('crea');
      if (closed) return;
      if (a === 'search') {
        if (I.searched.includes(id) || I.actions < 1) return;
        I.searched.push(id); I.actions -= 1; lastRoom = id;
        const n = visible().filter(c => c.room === id).length;
        flashT = 'Estratti ' + n + ' movimenti da ' + byId(ROOMS, id).name + ': li trovi evidenziati in fondo a destra. Operazioni residue: ' + I.actions + '.';
        redraw(); save();
      } else if (a === 'tool') {
        const cost = id === 'autopsy' ? 1 : 2; if (I[id] || I.actions < cost) return;
        I[id] = true; I.actions -= cost; lastRoom = null;
        flashT = (id === 'autopsy' ? 'Referto medico: ' + W.autopsy : 'Il vigilante: ' + interrogText().toLowerCase() + '.') + ' Operazioni residue: ' + I.actions + '.';
        redraw(); save();
      } else if (a === 'lab') {
        if (I.lab.some(l => l.clueId === id) || I.actions < 2) return;
        I.lab.push({ clueId: id }); I.actions -= 2; lastRoom = null;
        const c = caso.clues.find(x => x.id === id);
        flashT = (c.kind === 'falso' ? 'Movimento non conforme: qualcuno ha lavorato di fantasia.' : 'Movimento conforme: è autentico.') + ' Operazioni residue: ' + I.actions + '.';
        redraw(); save();
      } else if (a === 'mark') { I.marks[id] = (mark(id) + 1) % 3; redraw(); save(); }
      else if (a === 'close') accuse();
    }
  });
}
</script>
</body>
</html>
